definitions:
  model.Menu:
    properties:
      children:
        items:
          $ref: '#/definitions/model.Menu'
        type: array
      code:
        type: string
      created_at:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      path:
        type: string
      sort:
        type: integer
      status:
        type: integer
      type:
        description: 1=directory, 2=menu, 3=button
        type: integer
      updated_at:
        type: string
    type: object
  model.Product:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      owner:
        $ref: '#/definitions/model.User'
      owner_id:
        type: integer
      status:
        description: 0=planning, 1=developing, 2=online, 3=offline
        type: integer
      updated_at:
        type: string
    type: object
  model.Requirement:
    properties:
      assignee:
        $ref: '#/definitions/model.User'
      assignee_id:
        type: integer
      created_at:
        type: string
      creator:
        $ref: '#/definitions/model.User'
      creator_id:
        type: integer
      description:
        type: string
      id:
        type: integer
      priority:
        description: 1=high, 2=medium, 3=low
        type: integer
      product:
        $ref: '#/definitions/model.Product'
      product_id:
        type: integer
      status:
        description: 0=pending, 1=accepted, 2=developing, 3=completed, 4=rejected
        type: integer
      title:
        type: string
      type:
        description: 1=business, 2=user, 3=development
        type: integer
      updated_at:
        type: string
    type: object
  model.Role:
    properties:
      code:
        type: string
      created_at:
        type: string
      desc:
        type: string
      id:
        type: integer
      name:
        type: string
      sort:
        type: integer
      status:
        type: integer
      updated_at:
        type: string
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      phone:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  response.PageResult:
    properties:
      list: {}
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  service.CreateMenuRequest:
    properties:
      code:
        type: string
      icon:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      path:
        type: string
      sort:
        type: integer
      type:
        type: integer
    required:
    - name
    - type
    type: object
  service.CreateProductRequest:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
      owner_id:
        type: integer
      status:
        type: integer
    required:
    - code
    - name
    type: object
  service.CreateRequirementRequest:
    properties:
      assignee_id:
        type: integer
      creator_id:
        type: integer
      description:
        type: string
      priority:
        type: integer
      product_id:
        type: integer
      title:
        type: string
      type:
        type: integer
    required:
    - product_id
    - title
    - type
    type: object
  service.CreateRoleRequest:
    properties:
      code:
        type: string
      desc:
        type: string
      name:
        type: string
      sort:
        type: integer
    required:
    - code
    - name
    type: object
  service.CreateUserRequest:
    properties:
      email:
        type: string
      nickname:
        type: string
      password:
        type: string
      phone:
        type: string
      role_id:
        type: integer
      username:
        type: string
    required:
    - password
    - username
    type: object
  service.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  service.LoginResponse:
    properties:
      token:
        type: string
      user_info:
        $ref: '#/definitions/service.UserInfoVO'
    type: object
  service.SetMenusRequest:
    properties:
      menu_ids:
        items:
          type: integer
        type: array
    type: object
  service.UpdateMenuRequest:
    properties:
      code:
        type: string
      icon:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      path:
        type: string
      sort:
        type: integer
      status:
        type: integer
      type:
        type: integer
    type: object
  service.UpdateProductRequest:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
      owner_id:
        type: integer
      status:
        type: integer
    type: object
  service.UpdateRequirementRequest:
    properties:
      assignee_id:
        type: integer
      description:
        type: string
      priority:
        type: integer
      status:
        type: integer
      title:
        type: string
      type:
        type: integer
    type: object
  service.UpdateRoleRequest:
    properties:
      desc:
        type: string
      name:
        type: string
      sort:
        type: integer
    type: object
  service.UpdateUserRequest:
    properties:
      email:
        type: string
      nickname:
        type: string
      phone:
        type: string
      role_id:
        type: integer
      status:
        type: integer
    type: object
  service.UserInfoVO:
    properties:
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 用户使用用户名密码登录，返回JWT token
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - 认证
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: 用户登出，注销当前会话
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 认证
  /api/auth/userinfo:
    get:
      consumes:
      - application/json
      description: 获取已登录用户的详细信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.UserInfoVO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - 认证
  /api/menus:
    get:
      consumes:
      - application/json
      description: 获取所有菜单列表（扁平结构）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
